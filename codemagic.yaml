workflows:

  # ── Signed IPA → TestFlight ──────────────────────────────────────────────────
  ios-signed:
    name: iOS — Signed (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: aeriemed

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Set up keychain
        script: keychain initialize

      - name: Ensure App Groups capability is enabled on both App IDs
        script: |
          for BUNDLE_ID in com.peninsulathreat.resqruck com.peninsulathreat.resqruck.widget; do
            RESOURCE_ID=$(app-store-connect bundle-ids list --identifier "$BUNDLE_ID" --json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
            if [ -z "$RESOURCE_ID" ]; then
              echo "No App ID registered yet for $BUNDLE_ID -- fetch-signing-files --create will register it next."
              continue
            fi
            echo "$BUNDLE_ID -> $RESOURCE_ID"
            echo "Capabilities before:"
            app-store-connect bundle-ids capabilities "$RESOURCE_ID" || true
            app-store-connect bundle-ids enable-capabilities "$RESOURCE_ID" --capability APP_GROUPS || true
            echo "Capabilities after:"
            app-store-connect bundle-ids capabilities "$RESOURCE_ID" || true
          done

      - name: Fetch signing files from Apple
        script: |
          app-store-connect fetch-signing-files \
            com.peninsulathreat.resqruck \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --delete-stale-profiles
          app-store-connect fetch-signing-files \
            com.peninsulathreat.resqruck.widget \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create \
            --delete-stale-profiles
          keychain add-certificates

      - name: Flutter packages
        script: flutter pub get

      - name: Add home-screen widget extension target
        script: |
          gem install xcodeproj --no-document
          cd ios && ruby add_widget_extension.rb

      - name: CocoaPods install
        script: cd ios && pod install

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - extest
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Unsigned IPA (no Apple Developer account required) ──────────────────────
  ios-unsigned:
    name: iOS — Unsigned (Sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r AerieMed-unsigned.ipa Payload/

    artifacts:
      - build/ios/unsigned/AerieMed-unsigned.ipa

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Android AAB (Play Store bundle) ──────────────────────────────────────────
  android-release:
    name: Android — AAB (Bundle)
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: Build Android bundle
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Windows EXE ──────────────────────────────────────────────────────────────
  windows-release:
    name: Windows — EXE
    instance_type: windows_x2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable

    scripts:
      - name: Checkout submodules
        script: |
          cd $env:CM_BUILD_DIR
          git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: Build Windows
        script: flutter build windows --release

      - name: Package ZIP
        script: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath $env:CM_BUILD_DIR/AeriMed-windows.zip

    artifacts:
      - $env:CM_BUILD_DIR/AeriMed-windows.zip

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true
