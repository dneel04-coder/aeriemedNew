workflows:

  # ── Signed IPA → TestFlight ──────────────────────────────────────────────────
  ios-signed:
    name: iOS — Signed (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: aeriemed

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Set up keychain
        script: keychain initialize

      - name: Delete any existing App Store profiles (force a clean regenerate)
        script: |
          app-store-connect profiles list --type IOS_APP_STORE --json > /tmp/existing_profiles.json
          python3 -c "import json; print('\n'.join(p['id'] for p in json.load(open('/tmp/existing_profiles.json'))))" > /tmp/profile_ids.txt
          while IFS= read -r PROFILE_ID; do
            [ -z "$PROFILE_ID" ] && continue
            echo "Deleting stale profile: $PROFILE_ID"
            app-store-connect profiles delete "$PROFILE_ID" --ignore-not-found || true
          done < /tmp/profile_ids.txt

      - name: Fetch signing files from Apple
        script: |
          app-store-connect fetch-signing-files \
            com.peninsulathreat.resqruck \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

      - name: Flutter packages
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - extest
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Unsigned IPA (no Apple Developer account required) ──────────────────────
  ios-unsigned:
    name: iOS — Unsigned (Sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r AerieMed-unsigned.ipa Payload/

    artifacts:
      - build/ios/unsigned/AerieMed-unsigned.ipa

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── iOS App Store screenshots (automated via integration_test) ───────────────
  # Boots the required simulator sizes headless and drives the real app
  # through integration_test/screenshot_test.dart, which seeds a fake
  # logged-in/unlocked profile via SharedPreferences (no real login/paywall
  # flow, no credentials needed) then navigates to a few key screens.
  # test_driver/integration_test.dart saves each binding.takeScreenshot(...)
  # call to screenshots/<name>.png. First run will likely need the simulator
  # name patterns below adjusted once we see actual `simctl list` output on
  # Codemagic's current Xcode image.
  ios-screenshots:
    name: iOS — App Store Screenshots
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: CocoaPods install
        script: cd ios && pod install

      - name: List available runtimes and device types
        script: |
          xcrun simctl list runtimes available
          echo "---"
          xcrun simctl list devicetypes

      - name: Capture 6.5in-class iPhone screenshots
        script: |
          # Create a FRESH simulator from an installed runtime + device type
          # rather than trusting a pre-existing device catalog entry -- a
          # prior attempt picked an already-listed "available" device whose
          # UDID Xcode's own build system didn't recognize as a valid
          # destination at all ("Unable to find a destination matching").
          # simctl create fails immediately on an incompatible pairing,
          # which is a much more useful failure than that downstream one.
          RUNTIME=$(xcrun simctl list runtimes available | grep -i "iOS" | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS[A-Za-z0-9-]*')
          DEVTYPE=$(xcrun simctl list devicetypes | grep -iE "iPhone.*(Plus|Pro Max)" | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+')
          if [ -z "$RUNTIME" ] || [ -z "$DEVTYPE" ]; then
            echo "Could not resolve a runtime/device type pair -- see the list above and adjust the grep patterns."
            echo "RUNTIME=$RUNTIME DEVTYPE=$DEVTYPE"
            exit 1
          fi
          echo "Creating iPhone simulator: $DEVTYPE / $RUNTIME"
          UDID=$(xcrun simctl create "Screenshot-iPhone" "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # A headless `simctl boot` alone doesn't always register the
          # device with Xcode's own destination resolver -- explicitly
          # launching the Simulator.app GUI process against this UDID is
          # the standard fix for xcodebuild reporting only generic
          # placeholder destinations ("Any iOS Simulator Device") instead
          # of the concrete booted device.
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          rm -rf screenshots
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            -d "$UDID"
          DRIVE_STATUS=$?
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
          if [ $DRIVE_STATUS -ne 0 ]; then
            echo "flutter drive failed (exit $DRIVE_STATUS) -- no screenshots to collect."
            exit $DRIVE_STATUS
          fi
          mkdir -p artifacts/iphone_6_5
          mv screenshots/*.png artifacts/iphone_6_5/

      - name: Capture 13in iPad screenshots
        script: |
          RUNTIME=$(xcrun simctl list runtimes available | grep -i "iOS" | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS[A-Za-z0-9-]*')
          DEVTYPE=$(xcrun simctl list devicetypes | grep -iE "iPad Pro.*13" | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+')
          if [ -z "$RUNTIME" ] || [ -z "$DEVTYPE" ]; then
            echo "Could not resolve a runtime/device type pair -- see the list above and adjust the grep patterns."
            echo "RUNTIME=$RUNTIME DEVTYPE=$DEVTYPE"
            exit 1
          fi
          echo "Creating iPad simulator: $DEVTYPE / $RUNTIME"
          UDID=$(xcrun simctl create "Screenshot-iPad" "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # A headless `simctl boot` alone doesn't always register the
          # device with Xcode's own destination resolver -- explicitly
          # launching the Simulator.app GUI process against this UDID is
          # the standard fix for xcodebuild reporting only generic
          # placeholder destinations ("Any iOS Simulator Device") instead
          # of the concrete booted device.
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          rm -rf screenshots
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            -d "$UDID"
          DRIVE_STATUS=$?
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
          if [ $DRIVE_STATUS -ne 0 ]; then
            echo "flutter drive failed (exit $DRIVE_STATUS) -- no screenshots to collect."
            exit $DRIVE_STATUS
          fi
          mkdir -p artifacts/ipad_13
          mv screenshots/*.png artifacts/ipad_13/

    artifacts:
      - artifacts/**/*.png

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Android AAB (Play Store bundle) ──────────────────────────────────────────
  android-release:
    name: Android — AAB (Bundle)
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable

    scripts:
      - name: Checkout submodules
        script: cd "$CM_BUILD_DIR" && git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: Build Android bundle
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true

  # ── Windows EXE ──────────────────────────────────────────────────────────────
  windows-release:
    name: Windows — EXE
    instance_type: windows_x2
    max_build_duration: 60
    working_directory: aeriemed

    environment:
      flutter: stable

    scripts:
      - name: Checkout submodules
        script: |
          cd $env:CM_BUILD_DIR
          git submodule update --init --recursive

      - name: Flutter packages
        script: flutter pub get

      - name: Build Windows
        script: flutter build windows --release

      - name: Package ZIP
        script: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath $env:CM_BUILD_DIR/AeriMed-windows.zip

    artifacts:
      - $env:CM_BUILD_DIR/AeriMed-windows.zip

    publishing:
      email:
        recipients:
          - allamerican82consulting@gmail.com
        notify:
          success: true
          failure: true
